<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 41 · Avanzado</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#1D4ED8;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

const BANK=[{"q":"Sobre triángulos rectángulos, ¿cuál afirmación es correcta?","svg":"<svg viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triángulo con las medidas de sus lados\"><rect width=\"560\" height=\"270\" fill=\"#FFFFFF\"/><polygon points=\"216.2,215.0 343.8,215.0 216.2,45.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"267.0\" y=\"227.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"246.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">a<\/text><rect x=\"295.0\" y=\"112.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"308.0\" y=\"131.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">c<\/text><rect x=\"175.3\" y=\"112.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"188.2\" y=\"131.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">b<\/text><polyline fill=\"none\" stroke=\"#0F172A\" stroke-width=\"2.5\" points=\"232.2,215.0 232.2,199.0 216.2,199.0\"/><circle cx=\"216.2\" cy=\"215.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"200.2\" y=\"229.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">A<\/text><circle cx=\"343.8\" cy=\"215.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"359.8\" y=\"229.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">B<\/text><circle cx=\"216.2\" cy=\"45.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"216.2\" y=\"35.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C<\/text><\/svg>","o":["La hipotenusa es el lado opuesto al ángulo recto","El teorema de Pitágoras vale para cualquier tipo de triángulo","La hipotenusa es el lado más corto de un triángulo rectángulo","Si a + b = c, el triángulo de lados a, b y c es rectángulo","En un triángulo rectángulo, la hipotenusa es la suma de los catetos"],"s":"Argumentar","e":"Se contrasta con el teorema de Pitágoras y su recíproco."},{"q":"Un estudiante afirma: «Dos figuras con igual perímetro tienen siempre igual área». Considerando el rectángulo y el cuadrado de la figura (ambos de perímetro 16 cm), ¿es correcta su afirmación?","svg":"<svg viewBox=\"0 0 560 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Dos figuras con el mismo perímetro\"><rect width=\"560\" height=\"240\" fill=\"#FFFFFF\"/><rect x=\"50.0\" y=\"70.0\" width=\"168.0\" height=\"24.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"74.8\" y=\"102.5\" width=\"118.3\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"134.0\" y=\"121.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">7 cm × 1 cm<\/text><rect x=\"330.0\" y=\"40.0\" width=\"96.0\" height=\"96.0\" fill=\"#FEF3C7\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"318.9\" y=\"144.5\" width=\"118.3\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"378.0\" y=\"163.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4 cm × 4 cm<\/text><\/svg>","o":["No: el rectángulo tiene área 7 cm² y el cuadrado 16 cm², aunque sus perímetros son iguales","Sí: como sus perímetros son iguales, ambas áreas son 7 cm²","Sí: el cuadrado siempre tiene menor área que el rectángulo del mismo perímetro","No: porque los perímetros de las figuras no son iguales entre sí","Sí: el área y el perímetro miden lo mismo en cualquier figura plana"],"s":"Argumentar","e":"El perímetro y el área son medidas distintas: figuras con igual perímetro pueden tener áreas diferentes."},{"q":"Sobre el perímetro de figuras planas, ¿cuál afirmación es correcta?","svg":"<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Figura plana con las medidas de sus lados\"><rect width=\"560\" height=\"310\" fill=\"#FFFFFF\"/><polygon points=\"210.0,230.0 350.0,230.0 350.0,50.0 210.0,50.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"267.0\" y=\"236.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"255.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">7<\/text><rect x=\"363.0\" y=\"126.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"376.0\" y=\"145.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">9<\/text><circle cx=\"210.0\" cy=\"230.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"350.0\" cy=\"230.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"350.0\" cy=\"50.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"210.0\" cy=\"50.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><\/svg>","o":["Figuras con distinta forma pueden tener el mismo perímetro","El perímetro de un cuadrado de lado a es a²","La longitud de una circunferencia de radio r es πr²","El perímetro de un triángulo equilátero de lado a es 2a","El perímetro de un rectángulo de lados a y b es a·b"],"s":"Argumentar","e":"Se contrasta con la definición de perímetro y las fórmulas usuales."},{"q":"La figura está formada por dos rectángulos: uno de la parte superior y otro de la parte inferior izquierda. ¿Qué expresión permite calcular el área total?","svg":"<svg viewBox=\"0 0 560 275\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Figura compuesta por dos rectángulos\"><rect width=\"560\" height=\"275\" fill=\"#FFFFFF\"/><rect x=\"120.0\" y=\"40.0\" width=\"300.0\" height=\"100.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"120.0\" y=\"140.0\" width=\"130.0\" height=\"90.0\" fill=\"#FEF3C7\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><line x1=\"250.0\" y1=\"140.0\" x2=\"420.0\" y2=\"140.0\" stroke=\"#9A3412\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/><rect x=\"243.4\" y=\"10.5\" width=\"53.2\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"270.0\" y=\"29.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">10 m<\/text><rect x=\"73.0\" y=\"76.5\" width=\"43.9\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"95.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">5 m<\/text><rect x=\"163.1\" y=\"236.5\" width=\"43.9\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"185.0\" y=\"255.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3 m<\/text><rect x=\"73.0\" y=\"171.5\" width=\"43.9\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"190.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4 m<\/text><\/svg>","o":["10·5 + 3·4","10·5 − 3·4","(10 + 3)·(5 + 4)","10·5·3·4","2·(10 + 5) + 2·(3 + 4)"],"s":"Representar","e":"El área total es la suma de las áreas de las dos regiones rectangulares."},{"q":"¿Qué expresión permite calcular el área total de la superficie del prisma de la figura?","svg":"<svg viewBox=\"0 0 560 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Caja rectangular con sus diagonales\"><rect width=\"560\" height=\"300\" fill=\"#FFFFFF\"/><polygon points=\"90.0,163.0 340.0,163.0 452.5,91.0 202.5,91.0\" fill=\"#93C5FD\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"90.0,238.0 340.0,238.0 340.0,163.0 90.0,163.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"340.0,238.0 452.5,166.0 452.5,91.0 340.0,163.0\" fill=\"#BFDBFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><line x1=\"90.0\" y1=\"238.0\" x2=\"202.5\" y2=\"166.0\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"202.5\" y1=\"166.0\" x2=\"452.5\" y2=\"166.0\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"202.5\" y1=\"166.0\" x2=\"202.5\" y2=\"91.0\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><rect x=\"183.8\" y=\"258.5\" width=\"62.5\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"215.0\" y=\"277.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">10 cm<\/text><rect x=\"399.6\" y=\"204.5\" width=\"53.2\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"426.2\" y=\"223.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">9 cm<\/text><rect x=\"27.4\" y=\"187.0\" width=\"53.2\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"54.0\" y=\"205.8\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3 cm<\/text><\/svg>","o":["2·(10·9 + 9·3 + 10·3)","10·9·3","10·9 + 9·3 + 10·3","2·(10 + 9 + 3)","2·10·9 + 9·3"],"s":"Representar","e":"El área total es la suma de las áreas de las seis caras: tres pares de rectángulos iguales."},{"q":"¿Cuál de las siguientes afirmaciones sobre prismas y cilindros es falsa?","svg":"<svg viewBox=\"0 0 560 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Caja rectangular con sus diagonales\"><rect width=\"560\" height=\"300\" fill=\"#FFFFFF\"/><polygon points=\"90.0,113.0 340.0,113.0 444.2,46.3 194.2,46.3\" fill=\"#93C5FD\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"90.0,238.0 340.0,238.0 340.0,113.0 90.0,113.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"340.0,238.0 444.2,171.3 444.2,46.3 340.0,113.0\" fill=\"#BFDBFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><line x1=\"90.0\" y1=\"238.0\" x2=\"194.2\" y2=\"171.3\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"194.2\" y1=\"171.3\" x2=\"444.2\" y2=\"171.3\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"194.2\" y1=\"171.3\" x2=\"194.2\" y2=\"46.3\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><\/svg>","o":["El área lateral de un cilindro es πr²h","El área lateral de un cilindro es 2πrh","El volumen de un cilindro de radio r y altura h es πr²h","El volumen de un prisma es el área de su base por su altura","1 m³ equivale a 1.000 litros"],"s":"Argumentar","e":"Solo una afirmación contradice las fórmulas de volumen y superficie."},{"q":"¿Cuál de las siguientes afirmaciones sobre ángulos es verdadera?","svg":"<svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Dos rectas paralelas cortadas por una transversal\"><rect width=\"560\" height=\"260\" fill=\"#FFFFFF\"/><line x1=\"50.0\" y1=\"80.0\" x2=\"510.0\" y2=\"80.0\" stroke=\"#0B3D6E\" stroke-width=\"3.5\"/><line x1=\"50.0\" y1=\"180.0\" x2=\"510.0\" y2=\"180.0\" stroke=\"#0B3D6E\" stroke-width=\"3.5\"/><line x1=\"250.0\" y1=\"30.0\" x2=\"340.0\" y2=\"230.0\" strok ura plana con las medidas de sus lados\"><rect width=\"560\" height=\"310\" fill=\"#FFFFFF\"/><polygon points=\"92.5,230.0 467.5,230.0 332.5,50.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"252.2\" y=\"236.0\" width=\"55.7\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"255.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">10 m<\/text><rect x=\"407.8\" y=\"114.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"420.8\" y=\"133.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><rect x=\"174.0\" y=\"110.0\" width=\"45.8\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"196.9\" y=\"129.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">8 m<\/text><circle cx=\"92.5\" cy=\"230.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"467.5\" cy=\"230.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><circle cx=\"332.5\" cy=\"50.0\" r=\"4\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><\/svg>","o":["6 m","14 m","16 m","2 m","8 m"],"s":"Resolver problemas","e":"Se resta al perímetro los lados conocidos y se divide según corresponda: 6 m."},{"q":"¿Cuál es la longitud de la circunferencia de radio 20 cm? (Expresa el resultado en función de π.)","svg":"<svg viewBox=\"0 0 560 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Circunferencia con su radio o diámetro\"><rect width=\"560\" height=\"230\" fill=\"#FFFFFF\"/><circle cx=\"280\" cy=\"115\" r=\"90\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"4\"/><line x1=\"280.0\" y1=\"115.0\" x2=\"370.0\" y2=\"115.0\" stroke=\"#9A3412\" stroke-width=\"4\ eight=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Afirmación de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ángulo exterior de un triángulo = 56°<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ángulos interiores no adyacentes: 56° y 56°<\/text><\/svg>","o":["El ángulo exterior es igual a la suma de los interiores no adyacentes: sería 112°, no 56°","El ángulo exterior es igual a uno solo de los ángulos interiores no adyacentes","El ángulo exterior es igual a la diferencia de los interiores no adyacentes","El ángulo exterior es suplementario de la suma de todos los interiores","El ángulo exterior mide siempre 90° en cualquier triángulo cualquiera"],"s":"Argumentar","e":"El ángulo exterior es igual a la suma de los interiores no adyacentes: sería 112°, no 56°."},{"q":"Un estudiante afirma que existe un triángulo con ángulos interiores de 70°, 50° y 60°. ¿Es correcta su afirmación?","svg":"<svg viewBox=\"0 0 560 110\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ángulos: 70°, 50° y 60°\"><rect width=\"560\" height=\"110\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"60.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ángulos: 70°, 50° y 60°<\/text><\/svg>","o":["Sí, porque los tres ángulos suman 180°","No, porque un triángulo no puede tener un ángulo mayor que 90°","No, porque los tres ángulos deben ser iguales entre sí","Sí, porque cada uno de los ángulos es menor que 180°","No, porque los tres ángulos deben sumar 360°"],"s":"Argumentar","e":"La suma de los ángulos interiores de un triángulo es siempre 180°."},{"q":"En el triángulo de la figura, el ángulo x es exterior. ¿Cuánto mide x?","svg":"<svg viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triángulo con sus ángulos\"><rect width=\"560\" height=\"270\" fill=\"#FFFFFF\"/><polygon points=\"100.0,220.0 400.0,220.0 250.0,50.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><line x1=\"400.0\" y1=\"220.0\" x2=\"510.0\" y2=\"220.0\" stroke=\"#0F172A\" stroke-width=\"3.5\"/><rect x=\"439.0\" y=\"178.0\" width=\"25.9\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"452.0\" y=\"197.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><rect x=\"129.1\" y=\"184.0\" width=\"45.8\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"152.0\" y=\"203.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">55°<\/text><rect x=\"227.1\" y=\"78.0\" width=\"45.8\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"250.0\" y=\"97.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">69°<\/text><circle cx=\"100.0\" cy=\"220.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"84.0\" y=\"234.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">A<\/text><circle cx=\"400.0\" cy=\"220.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"416.0\" y=\"234.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">B<\/text><circle cx=\"250.0\" cy=\"50.0\" r=\"5\" fill=\"#0F172A\" stroke=\"#0F172A\" stroke-width=\"1\"/><text x=\"250.0\" y=\"40.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C<\/text><\/svg>","o":["124°","56°","125°","111°","236°"],"s":"Resolver problemas","e":"El ángulo exterior es la suma de los dos interiores no adyacentes: 55° + 69° = 124°."},{"q":"Un jardín rectangular de 12 m por 15 m está rodeado por un camino de 2 m de ancho. ¿Cuál es el área del camino?","svg":"<svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Jardín rodeado de un camino\"><rect width=\"560\" height=\"260\" fill=\"#FFFFFF\"/><rect x=\"120.0\" y=\"40.0\" width=\"320.0\" height=\"190.0\" fill=\"#FEF3C7\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"160.0\" y=\"80.0\" width=\"240.0\" height=\"110.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"140.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">12 m × 15 m<\/text><rect x=\"129.0\" y=\"47.0\" width=\"42.0\" height=\"26\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"64.9\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2 m<\/text><\/svg>","o":["124 m²","108 m²","304 m²","54 m²","128 m²"],"s":"Modelar","e":"Área total − área del jardín = 16·19 − 12·15 = 124 m²."},{"q":"¿Cuál de las siguientes afirmaciones sobre perímetros es falsa?","svg":"<svg viewBox=\"0 0 560 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Figura plana con las medidas de sus lados\"><rect width=\"560\" height=\"310\" fill=\"#FFFFFF\"/><polygon points=\"156.2,230.0 403.8,230.0 403.8,50.0 156.2,50.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"262.1\" y=\"236.0\" width=\"35.8\" height=\"28\" rx=\"8\" fill=\"#FFFF e cuentan los lados de cuadrado que quedan en el borde de la figura: 12."},{"q":"Un contenedor de agua con forma de prisma rectangular mide 50 cm de largo, 60 cm de ancho y 25 cm de alto. ¿Cuántos litros de agua caben si se llena completamente? (1 L = 1.000 cm³)","svg":"<svg viewBox=\"0 0 560 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Caja rectangular con sus diagonales\"><rect width=\"560\" height=\"300\" fill=\"#FFFFFF\"/><polygon points=\"90.0,138.0 290.0,138.0 410.0,61.2 210.0,61.2\" fill=\"#93C5FD\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"90.0,238.0 290.0,238.0 290.0,138.0 90.0,138.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><polygon points=\"290.0,238.0 410.0,161.2 410.0,61.2 290.0,138.0\" fill=\"#BFDBFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><line x1=\"90.0\" y1=\"238.0\" x2=\"210.0\" y2=\"161.2\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"210.0\" y1=\"161.2\" x2=\"410.0\" y2=\"161.2\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><line x1=\"210.0\" y1=\"161.2\" x2=\"210.0\" y2=\"61.2\" stroke=\"#64748B\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><rect x=\"158.8\" y=\"258.5\" width=\"62.5\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"277.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">50 cm<\/text><rect x=\"348.8\" y=\"202.1\" width=\"62.5\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"380.0\" y=\"220.8\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">60 cm<\/text><rect x=\"22.8\" y=\"174.5\" width=\"62.5\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"54.0\" y=\"193.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">25 cm<\/text><\/svg>","o":["75 L","75000 L","750 L","150 L","85 L"],"s":"Modelar","e":"V = 50·60·25 = 75000 cm³ = 75 L."},{"q":"A las 6:00 horas, ¿qué ángulo forman las manecillas de un reloj? (Se considera el menor ángulo.)","svg":"<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Reloj analógico Hora: 6:00 Cada hora = 30°\"><rect width=\"560\" height=\"150\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"100.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"57.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Reloj analógico<\/text><text x=\"280.0\" y=\"82.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Hora: 6:00<\/text><text x=\"280.0\" y=\"107.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Cada hora = 30°<\/text><\/svg>","o":["180°","36°","72°","90°","210°"],"s":"Modelar","e":"Cada número del reloj equivale a 30°; el ángulo pedido es 180°."}];
const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
</script>
